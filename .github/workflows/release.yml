name: release

on:
  workflow_run:
    workflows: [backend]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Manual version tag (e.g. v1.1.0). Leave empty to use v0.0.<run_number>.'
        required: false

permissions:
  contents: write

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve tag
        id: tag
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$MANUAL_VERSION" ]; then
            if ! [[ "$MANUAL_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid version '$MANUAL_VERSION'. Expected format: v<major>.<minor>.<patch>"
              exit 1
            fi
            echo "name=$MANUAL_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "name=v0.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        run: |
          git tag "${{ steps.tag.outputs.name }}"
          git push origin "${{ steps.tag.outputs.name }}"

      - name: Deploy (placeholder)
        run: echo "Deploying ${{ steps.tag.outputs.name }} (no deployment platform configured yet)"
